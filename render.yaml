services:
  - type: web
    name: globalvox-rsvp-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DATABASE_NAME
        value: globalvox_rsvp
      - key: MONGODB_URI
        sync: false
